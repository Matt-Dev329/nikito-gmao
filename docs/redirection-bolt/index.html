<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>ALBA a déménagé</title>
  <noscript><meta http-equiv="refresh" content="5; url=https://nikito.tech" /></noscript>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 24px 16px; background: #0a0e27; color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }
    .carte { width: 100%; max-width: 440px; background: #131836; border-radius: 18px; padding: 32px 24px; text-align: center; }
    .logo { font-size: 24px; font-weight: 700; letter-spacing: 4px; margin-bottom: 24px; }
    .logo span { color: #5DE5FF; }
    .logo small { color: #8b92b8; font-size: 13px; font-weight: 400; letter-spacing: 1px; }
    h1 { font-size: 20px; margin: 0 0 12px; }
    p { color: #8b92b8; font-size: 15px; line-height: 1.5; margin: 0 0 20px; }
    strong { color: #ffffff; }
    a.bouton {
      display: block; background: #5DE5FF; color: #0a0e27; text-decoration: none; font-weight: 700;
      font-size: 17px; border-radius: 12px; padding: 16px; min-height: 44px;
    }
    .note { font-size: 13px; margin: 20px 0 0; }
  </style>
</head>
<body>
  <main class="carte">
    <div class="logo"><span>A</span>LBA <small>by Nikito</small></div>
    <h1>Ce lien ne fonctionne plus</h1>
    <p>ALBA a une nouvelle adresse : <strong>nikito.tech</strong><br />Vos identifiants ne changent pas.</p>
    <a class="bouton" href="https://nikito.tech">Aller sur nikito.tech</a>
    <p class="note">Redirection automatique dans quelques secondes.<br />Pensez à remplacer votre favori ou l'icône de l'écran d'accueil.</p>
  </main>
  <script>
    // Supprime l'ancienne appli gardée en mémoire (service worker + caches)
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (regs) {
        regs.forEach(function (r) { r.unregister(); });
      }).catch(function () {});
    }
    if (window.caches) {
      caches.keys().then(function (cles) { cles.forEach(function (c) { caches.delete(c); }); }).catch(function () {});
    }
    setTimeout(function () { window.location.replace('https://nikito.tech' + (location.pathname.indexOf('/invitation/') === 0 || location.pathname === '/reset-password' ? location.pathname + location.search + location.hash : '')); }, 5000);
  </script>
</body>
</html>
