<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0A0B26" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>ALBA by Nikito</title>
    <meta name="description" content="ALBA — Gestion de maintenance des parcs Nikito. On prot&#232;ge les familles d&#232;s l'aube." />
    <style>
      /* Écran de démarrage (avant le chargement de l'appli) : logo animé plein écran */
      .alba-demarrage { position: fixed; inset: 0; background: #0A0B26; }
      .alba-demarrage video { width: 100%; height: 100%; object-fit: cover; }
      .alba-demarrage video::-webkit-media-controls,
      .alba-demarrage video::-webkit-media-controls-overlay-play-button,
      .alba-demarrage video::-webkit-media-controls-start-playback-button { display: none !important; -webkit-appearance: none; opacity: 0; }
      .alba-demarrage .large { display: none; }
      @media (min-width: 768px) and (min-height: 600px) and (orientation: landscape) {
        .alba-demarrage .large { display: block; }
        .alba-demarrage .tel { display: none; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Écran de démarrage : remplacé par l'application dès qu'elle est chargée -->
      <div class="alba-demarrage"><video class="tel" src="/logo-anime-tel.mp4" poster="/logo-anime-tel.jpg" autoplay muted loop playsinline disablepictureinpicture></video><video class="large" src="/logo-anime.mp4" poster="/logo-anime.jpg" autoplay muted loop playsinline disablepictureinpicture></video></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
